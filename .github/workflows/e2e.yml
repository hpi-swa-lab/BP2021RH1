name: End-to-end test

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
    branches:
      - main
      - staging
  # Also saves the node_modules and Cypress caches where every new PR can read them
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_e2e_tests:
    name: E2E runner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2]
    env:
      E2E_RUNNER: ${{ matrix.runner }}
      E2E_RUNNERS: 3
      E2E_CYPRESS_CACHE: /tmp/e2e-cache/cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore node_modules and Cypress caches
        uses: actions/cache@v4
        with:
          path: |
            projects/*/node_modules
            ${{ env.E2E_CYPRESS_CACHE }}
          key: e2e-node22-${{ hashFiles('projects/*/pnpm-lock.yaml') }}
          restore-keys: e2e-node22-
      - name: Run E2E tests
        run: compose/e2e.sh
      - name: Let the cache step read the files the containers wrote as root
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" projects/*/node_modules "$E2E_CYPRESS_CACHE"
      - name: Store screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.runner }}
          path: |
            projects/bp-gallery/cypress/screenshots
            /tmp/bp-e2e/*.log
          if-no-files-found: ignore

  # The check that branch protection requires
  e2e_result:
    name: Run E2E Tests
    needs: run_e2e_tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.run_e2e_tests.result }}" = success
