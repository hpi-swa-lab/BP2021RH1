name: Lint & Test CI

on: [push]

jobs:
  lint_bp_gallery:
    name: Lint bp-gallery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/bp-gallery

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/bp-graphql/package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            projects/bp-gallery/pnpm-lock.yaml
            projects/bp-graphql/pnpm-lock.yaml
      - name: Install bp-gallery dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bp-graphql dependencies
        working-directory: ./projects/bp-graphql
        run: pnpm install --frozen-lockfile && pnpm tsc
      - name: Generate APIConnector
        run: pnpm generate-api
      - name: Lint bp-gallery
        run: pnpm lint
      - name: Type check bp-gallery
        run: pnpm tsc
