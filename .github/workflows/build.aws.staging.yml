name: Build & Deploy AWS Staging CI

on:
  push:
    branches: [staging]

jobs:
  build_bp_gallery:
    name: Build & Deploy bp-gallery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/bp-gallery

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/bp-graphql/package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            projects/bp-gallery/pnpm-lock.yaml
            projects/bp-graphql/pnpm-lock.yaml
      - name: Install bp-gallery dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bp-graphql dependencies
        working-directory: ./projects/bp-graphql
        run: pnpm install --frozen-lockfile && pnpm tsc
      - name: Generate APIConnector
        run: pnpm generate-api
      - name: Build bp-gallery
        run: pnpm build:dev
      - name: Deploy build files on the server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "projects/bp-gallery/build/"
          strip_components: 3
          target: ${{ secrets.AWS_REMOTE_STAGING_TARGET }}
          rm: true
  build_bp_strapi:
    name: Build & Deploy bp-strapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/bp-strapi

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/bp-graphql/package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: |
            projects/bp-graphql/pnpm-lock.yaml
            projects/bp-strapi/pnpm-lock.yaml
      - name: Build bp-graphql
        working-directory: ./projects/bp-graphql
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install bp-strapi dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bp-strapi
        run: pnpm build
        env:
          URL: https://staging.harz-history.de/api/
      - name: Copy the build to the server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "projects/bp-strapi/dist/"
          strip_components: 3
          target: /home/github/harz-history-staging/strapi-dist
          rm: true
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ./deploy_key
          sudo chmod 600 ./deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        shell: bash
        env:
          SSH_KEY: ${{secrets.AWS_SSH_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.AWS_SSH_KNOWN_HOSTS}}
      - name: Deploy strapi on the server
        run: pnpm pm2 deploy ecosystem.aws.config.js staging
        env:
          REMOTE_HOST: ${{secrets.AWS_REMOTE_HOST}}
          REMOTE_USER: ${{secrets.REMOTE_USER}}
